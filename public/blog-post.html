<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Article — Prince Digital Labs</title>
<meta name="description" id="pageDescription" content="An article from Prince Digital Labs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .post-body { max-width: 720px; margin: 0 auto; font-size: 1.05rem; line-height: 1.75; }
  .post-body h2 { margin-top: var(--space-6); }
  .post-body h3 { margin-top: var(--space-5); }
  .post-body p { color: var(--ink); }
  .post-body img { border-radius: var(--radius-md); margin: var(--space-4) 0; }
  .post-body ul, .post-body ol { padding-left: 1.4em; margin-bottom: var(--space-3); color: var(--ink); }
  .post-body blockquote { border-left: 3px solid var(--primary); padding-left: var(--space-3); color: var(--ink-soft); font-style: italic; margin: var(--space-4) 0; }
  .post-body a { color: var(--primary); text-decoration: underline; }
  .post-meta { max-width: 720px; margin: 0 auto var(--space-5); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 0.85rem; color: var(--ink-faint); font-family: var(--font-mono); }
  .post-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--space-5); max-width: 720px; margin-left: auto; margin-right: auto; }
</style>
<link rel="icon" type="image/png" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">
</head>
<body data-page="blog.html">
<div id="notification-bar"></div>
<div id="site-header"></div>

<section class="section" id="postSection">
  <div class="container">
    <p style="color:var(--ink-faint);">Loading article…</p>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script src="js/pages/blog-post.js"></script>
</body>
</html>
