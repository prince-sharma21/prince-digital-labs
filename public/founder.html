<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder — Prince Digital Labs</title>
<meta name="description" content="Meet Prince, the founder of Prince Digital Labs — his background, skills, beliefs, and vision for the company.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
<link rel="apple-touch-icon" href="/images/favicon-180.png">
</head>
<body data-page="founder.html">
<div id="notification-bar"></div>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="eyebrow">The person behind the work</div>
    <h1>Meet the Founder</h1>
    <p class="lede">A quick look at who's behind Prince Digital Labs, and how I approach the work.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="founder-top reveal">
      <img id="founderPhoto" class="founder-photo" src="" alt="Founder photo" />
      <div class="founder-heading">
        <h2 id="founderName">Founder</h2>
        <p class="founder-role" id="founderRole"></p>
        <div id="founderBio" class="founder-bio"></div>
      </div>
    </div>
  </div>
</section>

<section class="section section-tight" style="background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="container">
    <div class="eyebrow center">What I work with</div>
    <h2 class="center" style="margin-bottom:var(--space-6);">Core skills</h2>
    <div class="grid grid-2" id="founderSkills"></div>
  </div>
</section>

<section class="section">
  <div class="container grid grid-2" style="align-items:start;gap:var(--space-6);">
    <div class="reveal">
      <h2>What I believe</h2>
      <p id="founderBelief"></p>
    </div>
    <div class="reveal">
      <h2>My approach</h2>
      <p id="founderApproach"></p>
    </div>
  </div>
</section>

<section class="section section-tight" style="background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="container">
    <div class="eyebrow center">Track record so far</div>
    <h2 class="center" style="margin-bottom:var(--space-6);">Professional highlights</h2>
    <ul class="feature-list founder-highlights" id="founderHighlights" style="max-width:640px;margin:0 auto;"></ul>
  </div>
</section>

<section class="section-dark" style="padding:var(--space-7) 0;">
  <div class="container center" style="max-width:680px;">
    <div class="eyebrow center">Founder vision</div>
    <p class="lede center" id="founderVision" style="color:#fff;margin:0 auto var(--space-5);"></p>
    <a href="contact.html" class="btn btn-accent">Work with me</a>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/site.js"></script>
<script src="js/pages/founder.js"></script>
</body>
</html>
