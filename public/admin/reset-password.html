<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Prince Digital Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/png" href="/images/favicon-32.png">
</head>
<body class="admin-body">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Set a new password</h1>
      <div class="form-error-box" id="errorBox"></div>
      <div class="form-success" id="successBox">
        <strong>Password updated.</strong> <a href="login.html" style="color:#0C6B4B;text-decoration:underline;">Sign in now</a>.
      </div>
      <form id="resetForm">
        <div class="form-field">
          <label for="newPassword">New password (10+ characters)</label>
          <input type="password" id="newPassword" required minlength="10" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Update password</button>
      </form>
    </div>
  </div>
  <script src="js/reset-password.js"></script>
</body>
</html>
